<!doctype html>
<!--
  Source for public/og-default.png (1200x630 social preview image).
  Regenerate with: node scripts/build-og-image.mjs
  Fonts are loaded locally so no remote request is made.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Amiri';
        font-style: normal;
        font-weight: 400;
        src: url('../public/fonts/amiri-400-arabic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Amiri';
        font-style: normal;
        font-weight: 700;
        src: url('../public/fonts/amiri-700-arabic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Noto Sans Syriac';
        font-style: normal;
        font-weight: 400;
        src: url('../public/fonts/noto-sans-syriac-400-syriac.woff2') format('woff2');
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        background: #faf6ee;
        color: #2b2118;
        font-family: 'Amiri', serif;
        overflow: hidden;
      }

      .frame {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 70px 90px;
        border-right: 22px solid #8c2f1f;
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 22px;
        margin-bottom: 26px;
      }

      .name {
        font-size: 108px;
        font-weight: 700;
        color: #8c2f1f;
        line-height: 1;
      }

      .name-syr {
        font-family: 'Noto Sans Syriac', sans-serif;
        font-size: 64px;
        color: #8a7a68;
        line-height: 1;
      }

      .tagline {
        font-size: 44px;
        line-height: 1.6;
        color: #2b2118;
        max-width: 980px;
      }

      .columns {
        display: flex;
        gap: 26px;
        margin-top: 54px;
      }

      .col {
        flex: 1;
        height: 96px;
        border: 2px solid #e2d6c2;
        border-radius: 14px;
        background: #fffdf8;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 0 26px;
      }

      .line {
        height: 10px;
        border-radius: 6px;
        background: #e2d6c2;
      }

      .line.short {
        width: 62%;
      }

      .col.syr .line {
        background: #8c2f1f;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="brand">
        <span class="name">Meltho</span>
        <span class="name-syr" lang="syr">ܡܠܬܐ</span>
      </div>
      <p class="tagline">ترجمات عربية لكتابات آباء الكنيسة السريانية، فقرة مقابل فقرة.</p>
      <div class="columns">
        <div class="col syr"><span class="line"></span><span class="line short"></span></div>
        <div class="col ar"><span class="line"></span><span class="line short"></span></div>
      </div>
    </div>
  </body>
</html>
